<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>OpenCode Connect</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: #0b0e14; color: #d7e0e8;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .card {
    width: 92%; max-width: 420px; margin: 24px auto;
    background: #141923; border: 1px solid #232b3a;
    border-radius: 14px; padding: 28px 24px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .5px; }
  .tag { color: #5f7aa8; font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: #8fa3bd; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 12px; font-size: 15px;
    background: #0b0e14; color: #e6edf3;
    border: 1px solid #2c3648; border-radius: 8px;
    outline: none;
  }
  input:focus { border-color: #4f8cff; }
  button {
    width: 100%; margin-top: 22px; padding: 13px;
    font-size: 16px; font-weight: 600; color: #fff;
    background: #3b82f6; border: 0; border-radius: 8px;
  }
  button:active { background: #2f6ad1; }
  .help { font-size: 12px; color: #5f7aa8; line-height: 1.5; margin-top: 20px; }
  .help code {
    background: #0b0e14; padding: 2px 6px; border-radius: 4px;
    color: #9ecbff; font-size: 11px;
  }
  .status { font-size: 12px; color: #ffb454; margin-top: 10px; display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>OpenCode</h1>
    <p class="tag">Connect to your OpenCode server</p>

    <label for="url">Server URL</label>
    <input id="url" type="url" inputmode="url" placeholder="http://192.168.1.100:4096"
           autocapitalize="off" autocomplete="url">

    <label for="user">Username</label>
    <input id="user" type="text" autocapitalize="off" autocomplete="username" placeholder="opencode">

    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="leave blank if none">

    <button id="go" onclick="connect()">Connect</button>

    <div class="help">
      Run this on the computer that runs OpenCode:<br>
      <code>opencode web --hostname 0.0.0.0 --port 4096</code><br><br>
      Optional password (same as <code>OPENCODE_SERVER_PASSWORD</code>):<br>
      <code>OPENCODE_SERVER_PASSWORD=secret opencode web --hostname 0.0.0.0</code>
    </div>
    <div class="status" id="status"></div>
  </div>

<script>
  function load() {
    try {
      var s = window.Android.getSettings().split("\n");
      var url = document.getElementById("url");
      var user = document.getElementById("user");
      var pass = document.getElementById("pass");
      if (s[0] && url.value === "") url.value = s[0];
      if (s[1]) user.value = s[1];
      if (s[2]) pass.value = s[2];
      if (!url.value) url.value = "http://127.0.0.1:4096";
    } catch (e) {}
  }
  function connect() {
    var url = document.getElementById("url").value.trim();
    var user = document.getElementById("user").value.trim();
    var pass = document.getElementById("pass").value;
    var st = document.getElementById("status");
    if (!url) { st.style.display = "block"; st.textContent = "Enter a server URL first."; return; }
    if (url.indexOf("://") === -1) url = "http://" + url;
    if (window.Android) {
      window.Android.save(url, user, pass);
    } else {
      location.href = url;
    }
  }
  document.addEventListener("DOMContentLoaded", load);
</script>
</body>
</html>
